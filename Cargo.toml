[package]
name = "moonglass"
version = "0.2.1"
description = "BX Team's design system for gpui: themes, window chrome and components on gpui and GPUI Base"
authors = ["BX Team"]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
homepage = "https://github.com/BX-Team/moonglass"
repository = "https://github.com/BX-Team/moonglass"
readme = "README.md"
keywords = ["gpui", "ui", "design-system", "theme"]
categories = ["gui"]
include = ["src/**", "assets/**", "examples/**", "README.md", "LICENSE"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-base = "0.9.0"
tracing = "0.1"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { package = "gpui-pre-web", version = "=0.3.12" }
